<!--SERVICES SECTION START-->
<section class="services" id="service">
  <div class="container d-flex flex-column justify-content-between h-100">

    <div class="section-title flex-grow-1">
      <div class="row">
        <div class="col-lg-12">
          <div class="text-center">
            <h2 data-aos="heading-show" class="rect_heading">Ce que je fais</h2>
            <p class="m-0">Mes domaines de compétences en développement et conception</p>
          </div>
        </div>
      </div>
    </div>

    <div class="section-content flex-grow-1">
      <div class="row">
        @for (s of services; track s.title) {
          <div class="col-lg-4 col-md-6 mt-4 mb-2">
            <div class="service-single text-center p-5">
              <div class="service-icon">
                <span [class]="s.icon"></span>
              </div>
              <h3 class="my-3">{{ s.title }}</h3>
              <p>{{ s.text }}</p>
            </div>
          </div>
        }
      </div>
    </div>

  </div>
</section>
<!--SERVICES SECTION END-->
